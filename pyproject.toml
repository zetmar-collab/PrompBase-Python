[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prompbase"
version = "2.8.0"
description = "Lokalna biblioteka promptów AI dla Windows i macOS — znajdź, skopiuj, wklej do ChatGPT/Claude."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary — użytek osobisty i edukacyjny" }
authors = [{ name = "Marek Zettel" }]
keywords = ["prompts", "ai", "chatgpt", "claude", "tkinter", "desktop"]

# Runtime aplikacji korzysta wyłącznie z biblioteki standardowej (tkinter).
# Brak zależności produkcyjnych jest celowy — patrz .cursorrules.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
prompbase = "promptbase:main"

[project.urls]
Homepage = "https://github.com/zetmar-collab/PrompBase-Python"
Releases = "https://github.com/zetmar-collab/PrompBase-Python/releases"

[tool.setuptools]
# Punkt wejścia (cienki moduł) + pakiet z logiką i UI.
py-modules = ["promptbase"]
packages = ["pbcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 110
# Pakiet aplikacji + wejście + testy + skrypty pomocnicze.
include = ["promptbase.py", "pbcore/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Aplikacja GUI: E501 (długie linie) i moduł-poziomowe importy po stałych
# bywają uzasadnione w jednym pliku; nie blokujemy buildu z ich powodu.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Pakiet pbcore agreguje publiczne API przez `import *` (re-eksport między
# modułami). F403/F405 to świadomy koszt tego wzorca; runtime chroni pytest.
"pbcore/*.py" = ["F403", "F405"]
"promptbase.py" = ["F403", "F405"]
