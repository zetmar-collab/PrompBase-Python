name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate icons (optional)
        run: |
          if (Test-Path generate_icons.py) { python generate_icons.py }
        continue-on-error: true

      - name: Build EXE and ZIP package
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1

      - name: Build Premium Prompty ZIP
        run: powershell -ExecutionPolicy Bypass -File scripts/build_premium_zip.ps1
        continue-on-error: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (Setup.exe)
        run: powershell -ExecutionPolicy Bypass -File scripts/build_installer.ps1

      - name: Build MSIX package (Microsoft Store)
        run: |
          python -m pip install --quiet pillow
          powershell -ExecutionPolicy Bypass -File scripts/build_msix.ps1
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: PrompBase-Windows
          path: |
            dist/PrompBase.exe
            dist/PrompBase-*-Setup.exe
            dist/PrompBase-*.msix
            dist/PrompBase-*-Windows.zip
            dist/PrompBase-*-Windows/
            dist/PrompBase-Premium-Prompty-*.zip
            dist/PrompBase-Premium-Prompty-*/
